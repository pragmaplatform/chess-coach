name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Test storage example
        run: cargo test --locked --no-default-features --features fsrs --examples
      - name: Test without default features
        run: cargo test --locked --no-default-features
      - name: Test standalone FSRS
        run: cargo test --locked --no-default-features --features fsrs
      - name: Check schemas without FSRS
        run: cargo check --locked --no-default-features --features openapi
      - name: Check public documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-features
