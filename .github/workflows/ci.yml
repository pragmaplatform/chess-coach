name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Test storage example
        run: cargo test --locked --no-default-features --features fsrs --examples
      - name: Test without default features
        run: cargo test --locked --no-default-features
      - name: Test standalone FSRS
        run: cargo test --locked --no-default-features --features fsrs
      - name: Check schemas without FSRS
        run: cargo check --locked --no-default-features --features openapi
      - name: Check public documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-features

  publish:
    name: Publish to crates.io
    needs: [check, msrv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether the version is published
        id: version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --user-agent 'chess-coach-ci (https://github.com/pragmaplatform/chess-coach)' \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/chess-coach/$version")
          case "$status" in
            200)
              echo "chess-coach $version is already published; skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Failed to check crates.io for chess-coach $version (HTTP $status)."
              exit 1
              ;;
          esac
      - name: Publish crate
        if: steps.version.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
